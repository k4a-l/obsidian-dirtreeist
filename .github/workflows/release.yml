name: Release
on:
    push:
        tags:
            - "[0-9]+.[0-9]+.[0-9]+"

jobs:
    build:
        name: Release
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"

            - name: install
              run: npm i

            - name: build
              run: npm run build

            - name: Create release
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                TAG: ${{ github.ref_name }}
              run: |
                gh release create "$TAG" \
                  --title "$TAG" \
                  --generate-notes \
                  main.js manifest.json styles.css
